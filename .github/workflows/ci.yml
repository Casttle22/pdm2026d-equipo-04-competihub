# TEMPORAL: verificación de la rama tmp/verificar-crud-form. Se borra al terminar.
name: Verificación temporal
on:
  push:
    branches: [tmp/verificar-crud-form]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Formato original
        id: formato
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Aplicar formato
        run: mkdir -p reportes && dart format lib test > reportes/format.txt 2>&1 || true
      - name: Análisis
        id: analisis
        continue-on-error: true
        run: flutter analyze > reportes/analyze.txt 2>&1
      - name: Pruebas
        id: pruebas
        continue-on-error: true
        run: flutter test --reporter expanded > reportes/test.txt 2>&1
      - name: Publicar reportes
        if: always()
        run: |
          flutter --version > reportes/version.txt 2>&1 || true
          git config user.name "ci-verificacion"
          git config user.email "ci@example.com"
          git add -A
          git commit -m "reportes de verificación" || true
          git push origin HEAD:tmp/verificar-crud-form
